# Hibernate owns the schema in tests: the project has no Flyway/Liquibase setup and the Boot
# default for a non-embedded database is ddl-auto=none, which would leave the container without
# any tables at all.
spring.jpa.hibernate.ddl-auto=create-drop
# PlayerEntity is mapped to the "advancedreports" schema while every other entity is in "public",
# so Hibernate has to be allowed to create the namespace as well.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
# Generous defaults so end-to-end tests do not throttle each other. The rate limit tests override
# these with their own low values via @TestPropertySource.
rate-limit.server-requests-per-second=1000
rate-limit.player-requests-per-second=1000
rate-limit.discord-requests-per-second=1000
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
