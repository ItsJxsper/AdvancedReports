name: Build and Release Module
on:
  push:
    tags:
      - "plugin-v*"
      - "proxy-v*"

permissions:
  contents: write
  packages: read

# GITHUB_ACTOR is set by GitHub Actions itself - only the token has to be set explicitly
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  determine-module:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.parse.outputs.module }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Tag Name
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MODULE="${TAG%%-v*}"
          VERSION="${TAG#${MODULE}-v}"

          if [[ "$MODULE" != "plugin" && "$MODULE" != "proxy" ]]; then
            echo "::error::Unknown module in tag: $TAG"
            exit 1
          fi

          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected module: $MODULE, version: $VERSION"

  build-and-release:
    needs: determine-module
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ needs.determine-module.outputs.module }}
      VERSION: ${{ needs.determine-module.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew


      # proxy pins toolchain 21, plugin needs 25 - without a toolchain resolver
      # both have to be installed
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag version against gradle.properties
        run: |
          FILE_VERSION=$(grep '^moduleVersion=' "$MODULE/gradle.properties" | cut -d'=' -f2)
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag version ($VERSION) does not match $MODULE/gradle.properties ($FILE_VERSION)"
            exit 1
          fi

      - name: Build ${{ env.MODULE }}
        run: ./gradlew :${{ env.MODULE }}:build

      - name: Determine JAR path
        id: jar
        run: |
          JAR_PATH=$(find "$MODULE/build/libs" -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n1)
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR_PATH"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.MODULE }} v${{ env.VERSION }}"
          files: |
            ${{ steps.jar.outputs.path }}