name: PR Build und Tests

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ develop, main ]

permissions:
  contents: read
  packages: read

# Neuer Push auf denselben PR (bzw. Branch) bricht den laufenden Job ab
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GITHUB_ACTOR setzt GitHub Actions selbst - nur das Token muss explizit gesetzt werden,
# damit settings.gradle.kts und build.gradle.kts sich bei GitHub Packages anmelden koennen
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-unit-test:
    name: Build und Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # proxy braucht 21, alle anderen Module 25 - Gradle kann ohne
      # Toolchain-Resolver nichts nachladen, also beide installieren
      - name: JDK 21 und 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4

      - name: Alle Module bauen (ohne Tests)
        run: ./gradlew build -x test --stacktrace

      - name: Unit-Tests (ohne Docker) + Coverage
        run: ./gradlew :backend:unitTest :backend:jacocoTestReport --stacktrace

      # Die @Disabled-Tests sind ein dokumentierter Bug-Backlog, kein Test-Schulden-Rest.
      # Ohne diesen Schritt sieht CI gruen aus, ohne dass jemand die Zahl im Blick hat.
      - name: Quarantaenierte Tests zaehlen
        if: always()
        run: |
          COUNT=$(grep -rho '@Disabled' backend/src/test --include='*.java' | wc -l)
          FILES=$(grep -rl '@Disabled' backend/src/test --include='*.java' | wc -l)
          echo "### Quarantaenierte Tests :construction:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **$COUNT** \`@Disabled\`-Tests in **$FILES** Dateien" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Jeder davon dokumentiert einen realen Bug. Betroffene Dateien:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep -rl '@Disabled' backend/src/test --include='*.java' \
            | sed 's|backend/src/test/java/de/itsjxsper/advancedreports/backend/||' \
            | sed 's|^|- `|; s|$|`|' >> "$GITHUB_STEP_SUMMARY"

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
            backend/build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  integration-test:
    name: Integrations- und E2E-Tests
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: JDK 21 und 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4

      - name: Docker-Daemon prüfen
        run: docker info

      - name: Integrations- und E2E-Tests (Testcontainers)
        run: ./gradlew :backend:integrationTest --stacktrace

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
