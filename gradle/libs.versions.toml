jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation-api" }
common = { module = "de.itsjxsper:common", version.ref = "common" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
