[versions]
paper-api = "26.2.build.+"
velocity-api = "3.5.0-SNAPSHOT"
minecraft = "26.2"

common = "0.00.3"

lombok = "1.18.46"
jetbrains-annotations = "26.1.0"
jackson-databind = "2.18.2"
jackson-datatype-jsr310 = "2.18.2"
jakarta-validation-api = "3.1.1"
okhttp = "4.12.0"


shadow = "9.5.1"
run-task = "3.0.2"
