[versions]
paper-api = "26.2.build.+"
velocity-api = "3.5.0-SNAPSHOT"
minecraft = "26.2"

common = "0.00.5"

lombok = "1.18.46"
jetbrains-annotations = "26.1.0"
jackson = "2.22.1"
jakarta-validation-api = "3.1.1"
gson = "2.14.0"
okhttp = "4.12.0"

shadow = "9.5.1"
run-task = "3.0.2"
resource-factory = "1.3.1"
idea-ext = "1.1.6"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation-api" }
common = { module = "de.itsjxsper:common", version.ref = "common" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }